<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5a7fa8" id="meta-theme-color">
  <meta name="color-scheme" content="light">
  <title>365.dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="header" id="app-header">
      <blockquote class="header-quote" id="header-quote"></blockquote>
      <p class="header-author" id="header-author"></p>
    </header>

    <main id="main-view" class="main-content">
      <section id="calendar-panel" class="panel active">
        <div class="calendar-card">
          <div class="calendar-header">
            <button id="prev-month" class="btn-icon" aria-label="上个月">‹</button>
            <h2 id="month-title"></h2>
            <button id="next-month" class="btn-icon" aria-label="下个月">›</button>
          </div>

          <div class="legend">
            <span class="legend-item"><span class="status-icon success">✓</span> 成功</span>
            <span class="legend-item"><span class="status-icon partial">○</span> 差点</span>
            <span class="legend-item"><span class="status-icon fail">✗</span> 失败</span>
          </div>

          <div class="weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span>
            <span>四</span><span>五</span><span>六</span>
          </div>

          <div id="calendar-grid" class="calendar-grid"></div>
          <div class="month-stats" id="month-stats"></div>
        </div>
      </section>

      <section id="summary-panel" class="panel">
        <div class="panel-head">
          <h2>全年日历</h2>
          <p class="panel-subtitle" id="summary-subtitle"></p>
        </div>
        <div class="year-calendar-section">
          <div class="year-calendar-head" id="year-calendar-head"></div>
          <p class="year-calendar-hint">点击日期打卡/编辑 · 长按已打卡日期可清空</p>
          <div class="year-calendar" id="year-calendar"></div>
        </div>
        <div class="summary-stats-block">
          <div class="summary-overview" id="summary-overview"></div>
          <div class="summary-cards" id="summary-cards"></div>
          <div class="summary-bar-wrap" id="summary-bar"></div>
          <div class="summary-insight" id="summary-insight"></div>
        </div>
      </section>

      <section id="records-panel" class="panel">
        <div class="panel-head">
          <h2>打卡记录</h2>
          <p class="panel-subtitle records-count" id="records-count"></p>
        </div>
        <div class="records-list" id="records-list"></div>
      </section>

      <section id="memos-panel" class="panel">
        <div class="memos-header">
          <div class="panel-head">
            <h2>备忘录</h2>
            <p class="panel-subtitle memos-count" id="memos-count"></p>
          </div>
          <button id="new-memo-btn" class="btn-primary btn-fab">+ 新建</button>
        </div>
        <div class="memos-list" id="memos-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="主导航">
      <button type="button" class="nav-item active" data-tab="calendar" aria-label="日历">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="nav-label">日历</span>
      </button>
      <button type="button" class="nav-item" data-tab="summary" aria-label="汇总">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span class="nav-label">汇总</span>
      </button>
      <button type="button" class="nav-item" data-tab="records" aria-label="记录">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span class="nav-label">记录</span>
      </button>
      <button type="button" class="nav-item" data-tab="memos" aria-label="备忘录">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <span class="nav-label">备忘</span>
      </button>
    </nav>

    <section id="data-panel" class="data-panel hidden">
      <div class="settings-page">
        <button id="data-back-btn" class="btn-secondary data-back-btn">← 返回</button>
        <h2 class="settings-title">设置</h2>

        <section class="settings-block">
          <h3 class="settings-block-title">主题</h3>
          <p class="settings-block-desc">默认蓝白；可切换深色模式</p>
          <div class="theme-options" id="theme-options">
            <button type="button" class="theme-option active" data-theme="light">蓝白</button>
            <button type="button" class="theme-option" data-theme="dark">深色</button>
          </div>
        </section>

        <section class="settings-block">
          <h3 class="settings-block-title">备份与恢复</h3>
          <p class="settings-block-desc">导出 JSON 可在换设备或重装后恢复数据</p>
          <p class="data-stats" id="data-stats"></p>
          <div class="data-actions">
            <button id="export-data-btn" class="btn-primary">导出 JSON</button>
            <button id="import-data-btn" class="btn-secondary">导入 JSON</button>
            <input type="file" id="import-file-input" accept=".json,application/json" hidden />
          </div>
          <p class="data-hint">导入会覆盖当前全部数据，请先导出备份</p>
        </section>
      </div>
    </section>
  </div>

  <div id="memo-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content memo-modal-content">
      <h3 id="memo-modal-title">新建备忘录</h3>
      <p class="modal-hint memo-md-hint">Markdown：# 标题 · **粗体** · *斜体* · `代码` · &gt; 引用 · - 列表 · 1. 有序列表 · --- 分隔线</p>
      <label class="memo-field-label" for="memo-input">内容</label>
      <textarea id="memo-input" class="memo-input" placeholder="第一行作为标题&#10;&#10;# 小标题&#10;写正文，支持 **粗体** 和列表..." rows="6"></textarea>
      <div class="memo-preview-wrap">
        <p class="memo-preview-label">预览</p>
        <div id="memo-preview" class="memo-body memo-preview"></div>
      </div>
      <label class="memo-pin-label">
        <input type="checkbox" id="memo-pin" />
        <span>在列表中置顶</span>
      </label>
      <div class="memo-modal-actions">
        <button id="save-memo-btn" class="btn-primary">保存</button>
        <button id="cancel-memo-btn" class="btn-close">取消</button>
      </div>
    </div>
  </div>

  <div id="checkin-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3 id="modal-date"></h3>
      <p class="modal-hint">选择打卡状态，并写一句话总结</p>
      <label class="summary-label" for="checkin-summary">一句话总结</label>
      <textarea id="checkin-summary" class="checkin-summary" placeholder="今天发生了什么？用一句话记录..." rows="3" maxlength="100"></textarea>
      <div class="status-options">
        <button class="status-btn success" data-status="success"><span class="status-icon success">✓</span><span>成功</span></button>
        <button class="status-btn partial" data-status="partial"><span class="status-icon partial">○</span><span>差点</span></button>
        <button class="status-btn fail" data-status="fail"><span class="status-icon fail">✗</span><span>失败</span></button>
      </div>
      <button id="clear-status" class="btn-clear">清除记录</button>
      <button id="close-modal" class="btn-close">关闭</button>
    </div>
  </div>

  <script src="quotes.js"></script>
  <script src="app.js"></script>
</body>
</html>
